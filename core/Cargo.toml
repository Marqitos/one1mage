[package]
name = "One1mage"
version = "0.1.0"
edition = "2024"
autolib = false

[dependencies]
windows = "0.58"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "tiff",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v5"] }
